apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: rollouts-demo-vsvc1
spec:
  gateways:
  - rollouts-demo-gateway
  hosts:
    - "*"
  http:
  - name: primary
    route:
    - destination:
        host: rollouts-demo-stable.default.svc.cluster.local
        port:
          number: 8080
      weight: 100
    - destination:
        host: rollouts-demo-canary.default.svc.cluster.local
        port:
          number: 8080
      weight: 0
